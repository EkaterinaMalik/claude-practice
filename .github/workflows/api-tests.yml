name: API Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Config lives in repo Variables (visible), credentials in repo Secrets (masked).
      # Manage with: gh variable list / gh secret list
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_AVATAR_URL: ${{ vars.TEST_AVATAR_URL }}
      TEST_EMAIL_DOMAIN: ${{ vars.TEST_EMAIL_DOMAIN }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_NEW_PASSWORD: ${{ secrets.TEST_NEW_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the suite on purpose: a few seconds, and it fails fast on a type
      # error rather than after a full run against the live API.
      - name: Typecheck
        run: npm run typecheck

      # The five files in .claude/commands/ generate tests, so they contain code
      # that nothing compiles. All five went stale through the Raw/wrapper refactor
      # before anyone noticed. This fails the build instead.
      - name: Check .claude/commands/ matches the API
        run: npm run check:commands

      - name: Run Playwright tests
        run: npx playwright test

      # dorny/test-reporter: v1 and v2 both run on node20, which GitHub has deprecated;
      # v3 is the first on node24. The inputs passed below are unchanged across the bump,
      # and `java-junit` is still the reporter Playwright's JUnit output needs.
      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Playwright Test Results
          path: junit-results/results.xml
          reporter: java-junit
          fail-on-error: false
          # Load-bearing. `use-actions-summary` defaults to 'true', and on that path the
          # action writes the report to the job summary and never calls checks.create -
          # so no "Playwright Test Results" check run appears on the commit or PR, failing
          # tests get no inline file annotations, and `checks: write` above is dead config.
          # The default is 'true' in the v1 tag as well, so this was never working; the
          # v3 bump did not cause it. Verified against the check-runs API on v1 and v3
          # commits alike: only the job's own `test` check was ever created.
          use-actions-summary: false

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
