name: API Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    # Pinned, not `ubuntu-latest`. GitHub migrates that label to Ubuntu 26 gradually
    # between 2026-10-19 and 2026-11-19, so during that window two runs of the same
    # commit can land on different images. performance.spec.ts asserts five 2000ms
    # thresholds, and a borderline timing flipping on a kernel change is indistinguishable
    # from a real regression. 24.04 is what ubuntu-latest resolved to before the rollout.
    # REVISIT after 2026-11-19: drop the pin, or move to ubuntu-26.04 and re-measure the
    # thresholds deliberately. Tracked in TEST_RECOMMENDATIONS.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Config lives in repo Variables (visible), credentials in repo Secrets (masked).
      # Manage with: gh variable list / gh secret list
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TEST_AVATAR_URL: ${{ vars.TEST_AVATAR_URL }}
      TEST_EMAIL_DOMAIN: ${{ vars.TEST_EMAIL_DOMAIN }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_NEW_PASSWORD: ${{ secrets.TEST_NEW_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the suite on purpose: a few seconds, and it fails fast on a type
      # error rather than after a full run against the live API.
      - name: Typecheck
        run: npm run typecheck

      # The five files in .claude/commands/ generate tests, so they contain code
      # that nothing compiles. All five went stale through the Raw/wrapper refactor
      # before anyone noticed. This fails the build instead.
      - name: Check .claude/commands/ matches the API
        run: npm run check:commands

      # Dependabot PRs and forked PRs both run with an empty secrets scope - GitHub
      # withholds repository secrets from them on purpose, so a dependency update or a
      # stranger's branch cannot exfiltrate them. This suite hits a live API and needs
      # TEST_PASSWORD, so it cannot run there. Without this gate the job failed with
      # "TEST_PASSWORD is not set", which reads like a broken suite and is not.
      #
      # Everything above this point - typecheck, the commands check, npm ci - needs no
      # secrets and still runs, so such a PR gets real signal rather than a red X.
      - name: Check whether the live suite can run
        id: creds
        run: |
          if [ -n "$TEST_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Live suite skipped"
              echo
              echo "No repository secrets in this context, so \`TEST_PASSWORD\` is empty."
              echo "Dependabot and forked pull requests run with an empty secrets scope by design."
              echo
              echo "Typecheck and the \`.claude/\` check above did run. The suite runs on \`master\`"
              echo "after merge - check there before trusting this PR."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Playwright tests
        if: steps.creds.outputs.available == 'true'
        run: npx playwright test

      # dorny/test-reporter: v1 and v2 both run on node20, which GitHub has deprecated;
      # v3 is the first on node24. The inputs passed below are unchanged across the bump,
      # and `java-junit` is still the reporter Playwright's JUnit output needs.
      - name: Publish test report
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        # !cancelled() rather than always(): cancel-in-progress above means a second
        # push cancels this run mid-suite, and on a cancelled run there is no complete
        # report to publish or upload. Still runs when an earlier step FAILED.
        if: ${{ !cancelled() && steps.creds.outputs.available == 'true' }}
        with:
          name: Playwright Test Results
          path: junit-results/results.xml
          reporter: java-junit
          fail-on-error: false
          # The suite step already decided the job, so this one never should. Without
          # this, a Typecheck failure skips the suite, leaves no results.xml behind, and
          # this step - which runs even then - fails a second time with "No test
          # report files were found". Two red steps, and the second one misleading.
          fail-on-empty: false
          # Load-bearing. `use-actions-summary` defaults to 'true', and on that path the
          # action writes the report to the job summary and never calls checks.create -
          # so no "Playwright Test Results" check run appears on the commit or PR, failing
          # tests get no inline file annotations, and `checks: write` above is dead config.
          # The default is 'true' in the v1 tag as well, so this was never working; the
          # v3 bump did not cause it. Verified against the check-runs API on v1 and v3
          # commits alike: only the job's own `test` check was ever created.
          use-actions-summary: false

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() && steps.creds.outputs.available == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure results
        if: ${{ !cancelled() && steps.creds.outputs.available == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
