# Keeps the pinned action SHAs current.
#
# Why this exists: the actions in api-tests.yml are pinned to commit SHAs, which is
# the safe way to use a third-party action but freezes them until someone looks. On
# 2026-10-17 four of them were still on the node20 runtime GitHub had deprecated, and
# finding that took a manual chase. Dependabot opens the PR instead, and the suite
# plus `npm run check:commands` decide whether it is safe to merge.
#
# The `# vX.Y.Z` comment after each SHA is not decoration - Dependabot reads it to
# know the current version, and rewrites both the SHA and the comment. Keep it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # npm is deliberately limited to SECURITY advisories only.
  #
  # `open-pull-requests-limit: 0` is the documented way to say that: it turns off
  # version-update PRs while security updates still come through, since those are
  # not subject to the limit.
  #
  # The first attempt used an `ignore` block for semver-patch and semver-minor. That
  # is backwards - it blocks the harmless bumps and lets MAJOR ones through. Within
  # minutes it opened three major bumps nobody asked for: dotenv 17->18,
  # @types/node 25->26, undici-types 7->8. Corrected 2026-10-17.
  #
  # Routine bumps are noise here: nothing ships from this repo and the suite is the
  # only consumer. A vulnerable dependency is still worth a PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    labels:
      - dependencies
