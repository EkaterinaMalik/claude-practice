# Keeps the pinned action SHAs current.
#
# Why this exists: the actions in api-tests.yml are pinned to commit SHAs, which is
# the safe way to use a third-party action but freezes them until someone looks. On
# 2026-10-17 four of them were still on the node20 runtime GitHub had deprecated, and
# finding that took a manual chase. Dependabot opens the PR instead, and the suite
# plus `npm run check:commands` decide whether it is safe to merge.
#
# The `# vX.Y.Z` comment after each SHA is not decoration - Dependabot reads it to
# know the current version, and rewrites both the SHA and the comment. Keep it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies

  # npm is deliberately limited to security advisories. A routine bump of a dev
  # dependency here is noise: nothing ships from this repo, and the suite is the
  # only consumer. A vulnerable transitive dependency is still worth a PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    labels:
      - dependencies
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
